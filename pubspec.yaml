name: spendio
description: "Spendio — Budget Tracker & Expense Manager"

publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.1.0
  path_provider: ^2.1.5
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  flutter_localization: ^0.3.3
  uuid: ^4.5.2
  build_runner: ^2.4.13
  build: ^2.4.1
  image_picker: ^1.2.1
  get_it: ^9.2.0
  flutter_svg: ^2.2.3
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.5.4
  fl_chart: ^1.1.1
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  workmanager: ^0.9.0+3
  permission_handler: ^12.0.1
  sqflite: ^2.4.2
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/splash/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# ── Native splash — paste BELOW the flutter: block, at root level ──
flutter_native_splash:
  color: "#060E1E"
  color_dark: "#060E1E"
  image: assets/splash/splash_logo_white.png
  image_dark: assets/splash/splash_logo_white.png
  fullscreen: false
  ios: true
  android: true
  web: false
  android_12:
    image: assets/splash/splash_logo_white.png
    icon_background_color: "#060E1E"
    image_dark: assets/splash/splash_logo_white.png
    icon_background_color_dark: "#060E1E"
