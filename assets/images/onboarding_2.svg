<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEE2E2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pie1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pie2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pie3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pie4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow2">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg2)"/>
  
  <!-- Decorative elements -->
  <circle cx="70" cy="70" r="45" fill="#8B5CF6" opacity="0.08"/>
  <circle cx="330" cy="90" r="55" fill="#06B6D4" opacity="0.08"/>
  <circle cx="340" cy="320" r="50" fill="#F59E0B" opacity="0.08"/>
  <circle cx="60" cy="330" r="40" fill="#EF4444" opacity="0.08"/>
  
  <!-- Title -->
  <text x="200" y="50" font-size="22" font-weight="bold" fill="#78350F" text-anchor="middle">Budget Overview</text>
  
  <!-- Main pie chart -->
  <g transform="translate(200, 210)">
    <!-- Shadow -->
    <circle r="95" fill="#000" opacity="0.12" transform="translate(4, 4)"/>
    
    <!-- Pie segments with hover effect -->
    <g filter="url(#shadow2)">
      <!-- Food - 35% -->
      <path d="M 0,-90 A 90,90 0 0,1 81,-38.7 L 0,0 Z" fill="url(#pie1)">
        <animate attributeName="opacity" values="1;0.9;1" dur="3s" repeatCount="indefinite"/>
      </path>
      
      <!-- Transport - 25% -->
      <path d="M 81,-38.7 A 90,90 0 0,1 38.7,81 L 0,0 Z" fill="url(#pie2)">
        <animate attributeName="opacity" values="1;0.9;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </path>
      
      <!-- Bills - 25% -->
      <path d="M 38.7,81 A 90,90 0 0,1 -81,38.7 L 0,0 Z" fill="url(#pie3)">
        <animate attributeName="opacity" values="1;0.9;1" dur="3s" begin="1s" repeatCount="indefinite"/>
      </path>
      
      <!-- Others - 15% -->
      <path d="M -81,38.7 A 90,90 0 0,1 0,-90 L 0,0 Z" fill="url(#pie4)">
        <animate attributeName="opacity" values="1;0.9;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Center circle -->
    <circle r="55" fill="#FFFFFF" filter="url(#shadow2)"/>
    <text y="-8" text-anchor="middle" font-size="16" font-weight="600" fill="#78350F">Total</text>
    <text y="12" text-anchor="middle" font-size="24" font-weight="bold" fill="#D97706">$2,450</text>
    <text y="28" text-anchor="middle" font-size="10" fill="#78350F" opacity="0.6">This month</text>
  </g>
  
  <!-- Legend with icons -->
  <g transform="translate(50, 340)">
    <!-- Food -->
    <rect x="-8" y="-8" width="16" height="16" rx="8" fill="#8B5CF6"/>
    <text x="18" y="4" font-size="13" font-weight="600" fill="#4C1D95">Food</text>
    <text x="18" y="16" font-size="10" fill="#78350F" opacity="0.7">35%</text>
    
    <!-- Transport -->
    <rect x="72" y="-8" width="16" height="16" rx="8" fill="#06B6D4"/>
    <text x="98" y="4" font-size="13" font-weight="600" fill="#164E63">Transport</text>
    <text x="98" y="16" font-size="10" fill="#78350F" opacity="0.7">25%</text>
    
    <!-- Bills -->
    <rect x="182" y="-8" width="16" height="16" rx="8" fill="#F59E0B"/>
    <text x="208" y="4" font-size="13" font-weight="600" fill="#78350F">Bills</text>
    <text x="208" y="16" font-size="10" fill="#78350F" opacity="0.7">25%</text>
    
    <!-- Others -->
    <rect x="262" y="-8" width="16" height="16" rx="8" fill="#EF4444"/>
    <text x="288" y="4" font-size="13" font-weight="600" fill="#7F1D1D">Others</text>
    <text x="288" y="16" font-size="10" fill="#78350F" opacity="0.7">15%</text>
  </g>
  
  <!-- Budget progress bars -->
  <g transform="translate(60, 100)">
    <!-- Food budget -->
    <rect x="0" y="0" width="120" height="4" rx="2" fill="#DDD6FE"/>
    <rect x="0" y="0" width="84" height="4" rx="2" fill="#8B5CF6">
      <animate attributeName="width" from="0" to="84" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="130" y="4" font-size="9" fill="#4C1D95" font-weight="600">$857</text>
  </g>
  
  <g transform="translate(220, 130)">
    <!-- Transport budget -->
    <rect x="0" y="0" width="120" height="4" rx="2" fill="#CFFAFE"/>
    <rect x="0" y="0" width="75" height="4" rx="2" fill="#06B6D4">
      <animate attributeName="width" from="0" to="75" dur="1.5s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="130" y="4" font-size="9" fill="#164E63" font-weight="600">$612</text>
  </g>
  
  <g transform="translate(50, 270)">
    <!-- Bills budget -->
    <rect x="0" y="0" width="110" height="4" rx="2" fill="#FEF3C7"/>
    <rect x="0" y="0" width="82" height="4" rx="2" fill="#F59E0B">
      <animate attributeName="width" from="0" to="82" dur="1.5s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="120" y="4" font-size="9" fill="#78350F" font-weight="600">$612</text>
  </g>
</svg>