<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DCFCE7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#BBF7D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bar4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F87171;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D1FAE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A7F3D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg3)"/>
  
  <!-- Decorative elements -->
  <circle cx="70" cy="70" r="45" fill="#10B981" opacity="0.08"/>
  <circle cx="330" cy="80" r="50" fill="#6366F1" opacity="0.08"/>
  <circle cx="350" cy="330" r="48" fill="#F59E0B" opacity="0.08"/>
  
  <!-- Title -->
  <text x="200" y="45" font-size="22" font-weight="bold" fill="#065F46" text-anchor="middle">Monthly Report</text>
  <text x="200" y="65" font-size="11" fill="#047857" text-anchor="middle" opacity="0.7">January 2026</text>
  
  <!-- Main chart area -->
  <g transform="translate(70, 100)">
    <!-- Grid lines -->
    <line x1="0" y1="40" x2="260" y2="40" stroke="#9CA3AF" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
    <line x1="0" y1="90" x2="260" y2="90" stroke="#9CA3AF" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
    <line x1="0" y1="140" x2="260" y2="140" stroke="#9CA3AF" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
    <line x1="0" y1="190" x2="260" y2="190" stroke="#9CA3AF" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
    
    <!-- Y-axis labels -->
    <text x="-10" y="44" font-size="9" fill="#6B7280" text-anchor="end">$800</text>
    <text x="-10" y="94" font-size="9" fill="#6B7280" text-anchor="end">$600</text>
    <text x="-10" y="144" font-size="9" fill="#6B7280" text-anchor="end">$400</text>
    <text x="-10" y="194" font-size="9" fill="#6B7280" text-anchor="end">$200</text>
    
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="190" stroke="#374151" stroke-width="2"/>
    <line x1="0" y1="190" x2="260" y2="190" stroke="#374151" stroke-width="2"/>
    
    <!-- Animated bars -->
    <g filter="url(#shadow3)">
      <!-- January -->
      <rect x="20" y="40" width="45" height="150" rx="6" fill="url(#bar1)">
        <animate attributeName="height" from="0" to="150" dur="1.2s" fill="freeze"/>
        <animate attributeName="y" from="190" to="40" dur="1.2s" fill="freeze"/>
      </rect>
      <text x="42.5" y="28" font-size="11" font-weight="bold" fill="#6366F1" text-anchor="middle">$750</text>
      
      <!-- February -->
      <rect x="80" y="70" width="45" height="120" rx="6" fill="url(#bar2)">
        <animate attributeName="height" from="0" to="120" dur="1.2s" begin="0.3s" fill="freeze"/>
        <animate attributeName="y" from="190" to="70" dur="1.2s" begin="0.3s" fill="freeze"/>
      </rect>
      <text x="102.5" y="58" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle">$600</text>
      
      <!-- March -->
      <rect x="140" y="50" width="45" height="140" rx="6" fill="url(#bar3)">
        <animate attributeName="height" from="0" to="140" dur="1.2s" begin="0.6s" fill="freeze"/>
        <animate attributeName="y" from="190" to="50" dur="1.2s" begin="0.6s" fill="freeze"/>
      </rect>
      <text x="162.5" y="38" font-size="11" font-weight="bold" fill="#F59E0B" text-anchor="middle">$700</text>
      
      <!-- April -->
      <rect x="200" y="95" width="45" height="95" rx="6" fill="url(#bar4)">
        <animate attributeName="height" from="0" to="95" dur="1.2s" begin="0.9s" fill="freeze"/>
        <animate attributeName="y" from="190" to="95" dur="1.2s" begin="0.9s" fill="freeze"/>
      </rect>
      <text x="222.5" y="83" font-size="11" font-weight="bold" fill="#EF4444" text-anchor="middle">$475</text>
    </g>
    
    <!-- X-axis labels -->
    <text x="42.5" y="210" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">Jan</text>
    <text x="102.5" y="210" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">Feb</text>
    <text x="162.5" y="210" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">Mar</text>
    <text x="222.5" y="210" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">Apr</text>
  </g>
  
  <!-- Stats cards -->
  <g transform="translate(50, 320)">
    <rect width="140" height="50" rx="12" fill="url(#cardBg1)" filter="url(#shadow3)"/>
    <text x="70" y="22" text-anchor="middle" font-size="10" fill="#1E40AF" font-weight="600">TOTAL SPENT</text>
    <text x="70" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A8A">$2,525</text>
  </g>
  
  <g transform="translate(210, 320)">
    <rect width="140" height="50" rx="12" fill="url(#cardBg2)" filter="url(#shadow3)"/>
    <text x="70" y="22" text-anchor="middle" font-size="10" fill="#065F46" font-weight="600">SAVED</text>
    <text x="70" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">$475</text>
  </g>
  
  <!-- Trend indicator -->
  <g transform="translate(320, 110)">
    <circle r="20" fill="#10B981" opacity="0.2"/>
    <path d="M 0,5 L 0,-5 L 7,-5" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="7" cy="-5" r="1.5" fill="#10B981"/>
    <text x="0" y="35" font-size="9" fill="#047857" text-anchor="middle" font-weight="600">+12%</text>
  </g>
  
  <!-- Bottom text -->
  <text x="200" y="387" font-size="20" font-weight="bold" fill="#065F46" text-anchor="middle">Detailed Reports</text>
  <text x="200" y="395" font-size="0" fill="#047857" text-anchor="middle"></text>
  
  <!-- Additional descriptive text repositioned -->
  <g transform="translate(200, 385)">
    <text x="0" y="17" font-size="12" fill="#047857" text-anchor="middle">Comprehensive analytics to understand</text>
    <text x="0" y="31" font-size="12" fill="#047857" text-anchor="middle">your financial health better</text>
  </g>
</svg>