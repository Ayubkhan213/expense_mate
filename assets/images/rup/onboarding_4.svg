<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E7FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DDD6FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCE7F3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow4">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow4">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="shieldGlow">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg4)"/>
  
  <!-- Decorative elements -->
  <circle cx="70" cy="70" r="45" fill="#6366F1" opacity="0.06"/>
  <circle cx="330" cy="80" r="50" fill="#10B981" opacity="0.06"/>
  <circle cx="340" cy="320" r="48" fill="#A855F7" opacity="0.06"/>
  <circle cx="60" cy="330" r="42" fill="#EC4899" opacity="0.06"/>
  
  <!-- Title -->
  <text x="200" y="50" font-size="22" font-weight="bold" fill="#312E81" text-anchor="middle">Bank-Level Security</text>
  
  <!-- Main shield illustration -->
  <g transform="translate(200, 200)">
    <!-- Glowing effect -->
    <circle r="120" fill="url(#shieldGlow)">
      <animate attributeName="r" values="110;125;110" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Shield shadow -->
    <path d="M 0,-100 L 65,-68 L 65,35 Q 65,55 0,95 Q -65,55 -65,35 L -65,-68 Z" 
          fill="#000" opacity="0.15" transform="translate(5, 5)"/>
    
    <!-- Main shield -->
    <path d="M 0,-100 L 65,-68 L 65,35 Q 65,55 0,95 Q -65,55 -65,35 L -65,-68 Z" 
          fill="url(#shield)" filter="url(#shadow4)">
      <animate attributeName="opacity" values="1;0.95;1" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Shield highlight -->
    <path d="M -50,-75 Q -20,-85 0,-90 L 0,-70 Q -25,-75 -50,-65 Z" 
          fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Checkmark -->
    <g filter="url(#glow4)">
      <path d="M -28,5 L -12,25 L 32,-32" 
            stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" 
            stroke-linejoin="round" fill="none">
        <animate attributeName="stroke-dasharray" from="0,100" to="100,0" dur="0.8s" fill="freeze"/>
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" fill="freeze"/>
      </path>
    </g>
    
    <!-- Inner shield details -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2"/>
  </g>
  
  <!-- Floating lock icons with animation -->
  <g transform="translate(90, 130)">
    <circle r="18" fill="#6366F1" opacity="0.15"/>
    <rect x="-8" y="2" width="16" height="16" rx="3" fill="url(#lockGrad)" opacity="0.8"/>
    <path d="M -6,2 L -6,-3 Q -6,-8 0,-8 Q 6,-8 6,-3 L 6,2" 
          stroke="url(#lockGrad)" stroke-width="2.5" fill="none" opacity="0.8"/>
    <circle cx="0" cy="10" r="2" fill="#FFFFFF" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" 
                      values="90,130; 90,120; 90,130" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </g>
  
  <g transform="translate(310, 150)">
    <circle r="18" fill="#10B981" opacity="0.15"/>
    <rect x="-8" y="2" width="16" height="16" rx="3" fill="#10B981" opacity="0.7"/>
    <path d="M -6,2 L -6,-3 Q -6,-8 0,-8 Q 6,-8 6,-3 L 6,2" 
          stroke="#10B981" stroke-width="2.5" fill="none" opacity="0.7"/>
    <circle cx="0" cy="10" r="2" fill="#FFFFFF" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" 
                      values="310,150; 310,140; 310,150" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </g>
  
  <g transform="translate(85, 270)">
    <circle r="16" fill="#A855F7" opacity="0.15"/>
    <rect x="-7" y="2" width="14" height="14" rx="2.5" fill="#A855F7" opacity="0.7"/>
    <path d="M -5,2 L -5,-2 Q -5,-6 0,-6 Q 5,-6 5,-2 L 5,2" 
          stroke="#A855F7" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="0" cy="9" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" 
                      values="85,270; 85,262; 85,270" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </g>
  
  <g transform="translate(315, 250)">
    <circle r="16" fill="#EC4899" opacity="0.15"/>
    <rect x="-7" y="2" width="14" height="14" rx="2.5" fill="#EC4899" opacity="0.7"/>
    <path d="M -5,2 L -5,-2 Q -5,-6 0,-6 Q 5,-6 5,-2 L 5,2" 
          stroke="#EC4899" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="0" cy="9" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" 
                      values="315,250; 315,242; 315,250" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Security features -->
  <g transform="translate(60, 315)">
    <!-- Feature 1 -->
    <circle cx="0" cy="0" r="6" fill="#10B981"/>
    <path d="M -2,0 L -1,2 L 3,-2" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="15" y="5" font-size="13" fill="#065F46" font-weight="600">256-bit encryption</text>
    
    <!-- Feature 2 -->
    <circle cx="0" cy="22" r="6" fill="#10B981"/>
    <path d="M -2,22 L -1,24 L 3,20" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="15" y="27" font-size="13" fill="#065F46" font-weight="600">Biometric authentication</text>
    
    <!-- Feature 3 -->
    <circle cx="0" cy="44" r="6" fill="#10B981"/>
    <path d="M -2,44 L -1,46 L 3,42" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="15" y="49" font-size="13" fill="#065F46" font-weight="600">Secure cloud backup</text>
  </g>
  
  <!-- Bottom text -->
  <text x="200" y="387" font-size="20" font-weight="bold" fill="#312E81" text-anchor="middle">Secure & Private</text>
  
  <!-- Additional descriptive text -->
  <g transform="translate(200, 385)">
    <text x="0" y="17" font-size="12" fill="#4C1D95" text-anchor="middle">Your data protected with enterprise-grade</text>
    <text x="0" y="31" font-size="12" fill="#4C1D95" text-anchor="middle">security. Privacy is our top priority</text>
  </g>
</svg>