<svg viewBox="0 0 390 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg_en1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D4A52"/>
      <stop offset="60%" style="stop-color:#3D5A65"/>
      <stop offset="100%" style="stop-color:#1a3340"/>
    </linearGradient>
    <linearGradient id="card_en1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a5a63"/>
      <stop offset="100%" style="stop-color:#2d4a52"/>
    </linearGradient>
    <linearGradient id="green_en" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF82"/>
      <stop offset="100%" style="stop-color:#2d8a5e"/>
    </linearGradient>
    <linearGradient id="red_en" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E05252"/>
      <stop offset="100%" style="stop-color:#c03030"/>
    </linearGradient>
    <filter id="glow_en">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card_shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="phone_clip_en">
      <rect x="95" y="60" width="200" height="370" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="390" height="580" fill="url(#bg_en1)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="58" x2="390" y2="58"/><line x1="0" y1="116" x2="390" y2="116"/>
    <line x1="0" y1="174" x2="390" y2="174"/><line x1="0" y1="232" x2="390" y2="232"/>
    <line x1="0" y1="290" x2="390" y2="290"/><line x1="0" y1="348" x2="390" y2="348"/>
    <line x1="0" y1="406" x2="390" y2="406"/><line x1="0" y1="464" x2="390" y2="464"/>
    <line x1="65" y1="0" x2="65" y2="580"/><line x1="130" y1="0" x2="130" y2="580"/>
    <line x1="195" y1="0" x2="195" y2="580"/><line x1="260" y1="0" x2="260" y2="580"/>
    <line x1="325" y1="0" x2="325" y2="580"/>
  </g>

  <!-- Decorative glow circles -->
  <circle cx="60" cy="120" r="90" fill="#4CAF82" opacity="0.07" filter="url(#glow_en)"/>
  <circle cx="330" cy="200" r="70" fill="#5bb8d4" opacity="0.08"/>
  <circle cx="80" cy="440" r="60" fill="#E05252" opacity="0.06"/>
  <circle cx="340" cy="400" r="50" fill="#4CAF82" opacity="0.07"/>

  <!-- Phone outer shell -->
  <rect x="95" y="60" width="200" height="370" rx="28" fill="#1a2d35" filter="url(#card_shadow)"/>
  <rect x="95" y="60" width="200" height="370" rx="28" fill="none" stroke="#4a6a75" stroke-width="1.5"/>

  <!-- Phone screen background -->
  <rect x="95" y="60" width="200" height="370" rx="28" fill="#2D4A52" clip-path="url(#phone_clip_en)"/>

  <!-- Dynamic island -->
  <rect x="168" y="72" width="54" height="11" rx="5.5" fill="#1a2d35"/>

  <!-- Header area -->
  <text x="115" y="95" font-size="9" fill="rgba(255,255,255,0.5)" font-weight="400">Total Balance</text>
  <text x="115" y="120" font-size="22" font-weight="800" fill="#FFFFFF">$20,020</text>
  <rect x="240" y="95" width="46" height="16" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <text x="263" y="107" font-size="7" fill="rgba(255,255,255,0.7)" text-anchor="middle">Mar 2026</text>

  <!-- Divider -->
  <line x1="109" y1="130" x2="281" y2="130" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>

  <!-- 4 stat cards -->
  <!-- Income card -->
  <rect x="108" y="138" width="78" height="50" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(76,175,130,0.3)" stroke-width="1"/>
  <rect x="115" y="146" width="18" height="18" rx="6" fill="url(#green_en)"/>
  <text x="124" y="158" font-size="9" fill="#FFFFFF" text-anchor="middle">↓</text>
  <text x="137" y="155" font-size="7.5" fill="rgba(255,255,255,0.65)">Income</text>
  <circle cx="115" cy="177" r="2.5" fill="#4CAF82"/>
  <text x="121" y="180" font-size="8.5" font-weight="700" fill="#4CAF82">+$25,787</text>

  <!-- Expense card -->
  <rect x="204" y="138" width="78" height="50" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(224,82,82,0.3)" stroke-width="1"/>
  <rect x="211" y="146" width="18" height="18" rx="6" fill="url(#red_en)"/>
  <text x="220" y="158" font-size="9" fill="#FFFFFF" text-anchor="middle">↑</text>
  <text x="233" y="155" font-size="7.5" fill="rgba(255,255,255,0.65)">Expense</text>
  <circle cx="211" cy="177" r="2.5" fill="#E05252"/>
  <text x="217" y="180" font-size="8.5" font-weight="700" fill="#E05252">-$10,400</text>

  <!-- You Owe -->
  <rect x="108" y="196" width="78" height="50" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(224,82,82,0.2)" stroke-width="1"/>
  <rect x="115" y="204" width="18" height="18" rx="6" fill="url(#red_en)"/>
  <text x="124" y="216" font-size="8" fill="#FFFFFF" text-anchor="middle">↘</text>
  <text x="137" y="213" font-size="7.5" fill="rgba(255,255,255,0.65)">You Owe</text>
  <circle cx="115" cy="235" r="2.5" fill="#E05252"/>
  <text x="121" y="238" font-size="8.5" font-weight="700" fill="#E05252">-$845</text>

  <!-- You're Owed -->
  <rect x="204" y="196" width="78" height="50" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(76,175,130,0.2)" stroke-width="1"/>
  <rect x="211" y="204" width="18" height="18" rx="6" fill="url(#green_en)"/>
  <text x="220" y="216" font-size="8" fill="#FFFFFF" text-anchor="middle">↗</text>
  <text x="233" y="213" font-size="7.5" fill="rgba(255,255,255,0.65)">You're Owed</text>
  <circle cx="211" cy="235" r="2.5" fill="#4CAF82"/>
  <text x="217" y="238" font-size="8.5" font-weight="700" fill="#4CAF82">+$5,478</text>

  <!-- Tab bar on phone -->
  <rect x="109" y="255" width="172" height="22" rx="11" fill="rgba(255,255,255,0.06)"/>
  <rect x="111" y="257" width="82" height="18" rx="9" fill="#2D4A52" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <text x="152" y="270" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">💰 transactions</text>
  <text x="234" y="270" font-size="7.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">💵 Debt</text>

  <!-- Recent tx label -->
  <text x="112" y="289" font-size="8" font-weight="700" fill="rgba(255,255,255,0.9)">Recent Transactions</text>

  <!-- Transaction rows -->
  <rect x="109" y="295" width="172" height="34" rx="10" fill="rgba(255,255,255,0.06)"/>
  <rect x="115" y="301" width="22" height="22" rx="8" fill="rgba(76,175,130,0.2)"/>
  <text x="126" y="315" font-size="12" text-anchor="middle">💵</text>
  <text x="144" y="311" font-size="8" font-weight="700" fill="#FFFFFF">Freelance</text>
  <text x="144" y="321" font-size="6.5" fill="rgba(255,255,255,0.4)">Mar 07 • Cash</text>
  <text x="277" y="315" font-size="9" font-weight="700" fill="#4CAF82" text-anchor="end">+$55</text>

  <rect x="109" y="333" width="172" height="34" rx="10" fill="rgba(255,255,255,0.06)"/>
  <rect x="115" y="339" width="22" height="22" rx="8" fill="rgba(224,82,82,0.2)"/>
  <text x="126" y="353" font-size="12" text-anchor="middle">🚗</text>
  <text x="144" y="349" font-size="8" font-weight="700" fill="#FFFFFF">Transport</text>
  <text x="144" y="359" font-size="6.5" fill="rgba(255,255,255,0.4)">Mar 07 • Cash</text>
  <text x="277" y="353" font-size="9" font-weight="700" fill="#E05252" text-anchor="end">-$28</text>

  <!-- Bottom nav on phone -->
  <rect x="109" y="373" width="172" height="48" rx="0" fill="rgba(255,255,255,0.04)"/>
  <line x1="109" y1="374" x2="281" y2="374" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
  <text x="126" y="392" font-size="8" text-anchor="middle" fill="rgba(255,255,255,0.9)">🏠</text>
  <text x="126" y="403" font-size="5.5" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-weight="700">Home</text>
  <text x="158" y="392" font-size="8" text-anchor="middle" fill="rgba(255,255,255,0.4)">💼</text>
  <text x="158" y="403" font-size="5.5" text-anchor="middle" fill="rgba(255,255,255,0.4)">Budgets</text>
  <text x="195" y="392" font-size="8" text-anchor="middle" fill="rgba(255,255,255,0.4)">↺</text>
  <text x="195" y="403" font-size="5.5" text-anchor="middle" fill="rgba(255,255,255,0.4)">Recurring</text>
  <text x="232" y="392" font-size="8" text-anchor="middle" fill="rgba(255,255,255,0.4)">📊</text>
  <text x="232" y="403" font-size="5.5" text-anchor="middle" fill="rgba(255,255,255,0.4)">Analytics</text>
  <text x="264" y="392" font-size="8" text-anchor="middle" fill="rgba(255,255,255,0.4)">👤</text>
  <text x="264" y="403" font-size="5.5" text-anchor="middle" fill="rgba(255,255,255,0.4)">Profile</text>

  <!-- Floating badges outside phone -->
  <g transform="translate(18, 180)" filter="url(#card_shadow)">
    <rect width="68" height="52" rx="14" fill="#4CAF82"/>
    <text x="34" y="20" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">Income</text>
    <text x="34" y="36" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">↓</text>
    <text x="34" y="47" font-size="7.5" fill="rgba(255,255,255,0.85)" text-anchor="middle">This Month</text>
  </g>

  <g transform="translate(304, 220)" filter="url(#card_shadow)">
    <rect width="68" height="52" rx="14" fill="#E05252"/>
    <text x="34" y="20" font-size="8" fill="rgba(255,255,255,0.8)" text-anchor="middle">Expense</text>
    <text x="34" y="36" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">↑</text>
    <text x="34" y="47" font-size="7.5" fill="rgba(255,255,255,0.85)" text-anchor="middle">This Month</text>
  </g>

  <!-- Add transaction floating button -->
  <g transform="translate(280, 350)">
    <rect width="92" height="34" rx="17" fill="#2D4A52" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="46" y="21" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="600">+ transactions</text>
  </g>

  </svg>
