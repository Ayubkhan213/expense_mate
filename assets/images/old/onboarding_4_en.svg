<svg viewBox="0 0 390 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2f3a"/><stop offset="100%" style="stop-color:#0d1e28"/>
    </linearGradient>
    <linearGradient id="gf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF82;stop-opacity:0.4"/><stop offset="100%" style="stop-color:#4CAF82;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="rf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E05252;stop-opacity:0.3"/><stop offset="100%" style="stop-color:#E05252;stop-opacity:0"/>
    </linearGradient>
    <!-- Theme preview gradients -->
    <linearGradient id="th1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2D4A52"/><stop offset="100%" style="stop-color:#1a3340"/></linearGradient>
    <linearGradient id="th2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1a3a2a"/><stop offset="100%" style="stop-color:#0d2018"/></linearGradient>
    <linearGradient id="th3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2D2D52"/><stop offset="100%" style="stop-color:#1a1a40"/></linearGradient>
    <linearGradient id="th4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#3a2a1a"/><stop offset="100%" style="stop-color:#2a1a0d"/></linearGradient>
    <linearGradient id="th5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#3a1a2a"/><stop offset="100%" style="stop-color:#2a0d1a"/></linearGradient>
    <linearGradient id="th6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f8fafc"/><stop offset="100%" style="stop-color:#e2e8f0"/></linearGradient>
    <filter id="sh">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pc"><rect x="100" y="58" width="190" height="310" rx="26"/></clipPath>
  </defs>

  <rect width="390" height="580" fill="url(#bg)"/>

  <!-- Background ambient glows -->
  <circle cx="60" cy="150" r="100" fill="#4CAF82" opacity="0.06"/>
  <circle cx="340" cy="100" r="80" fill="#9B6FD4" opacity="0.07"/>
  <circle cx="320" cy="400" r="90" fill="#3AAFA9" opacity="0.06"/>
  <circle cx="70" cy="420" r="70" fill="#F59E0B" opacity="0.05"/>

  <!-- Subtle dots grid -->
  <g opacity="0.05" fill="#FFFFFF">
    <circle cx="30" cy="30" r="1.5"/><circle cx="90" cy="30" r="1.5"/><circle cx="150" cy="30" r="1.5"/><circle cx="210" cy="30" r="1.5"/><circle cx="270" cy="30" r="1.5"/><circle cx="330" cy="30" r="1.5"/>
    <circle cx="360" cy="60" r="1.5"/><circle cx="360" cy="120" r="1.5"/><circle cx="360" cy="180" r="1.5"/>
    <circle cx="30" cy="540" r="1.5"/><circle cx="90" cy="540" r="1.5"/><circle cx="150" cy="540" r="1.5"/><circle cx="210" cy="540" r="1.5"/><circle cx="270" cy="540" r="1.5"/><circle cx="330" cy="540" r="1.5"/>
  </g>

  <!-- ══════════════════════════════════════════ -->
  <!-- PHONE MOCKUP (centered, slightly smaller) -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="100" y="58" width="190" height="310" rx="26" fill="#0d1e28" filter="url(#sh)"/>
  <rect x="100" y="58" width="190" height="310" rx="26" fill="none" stroke="#2a4050" stroke-width="1.5"/>
  <rect x="100" y="58" width="190" height="310" rx="26" fill="#1a2f3a" clip-path="url(#pc)"/>
  <!-- Dynamic island -->
  <rect x="170" y="69" width="50" height="10" rx="5" fill="#0d1e28"/>

  <!-- === ANALYTICS TAB CONTENT on phone === -->
  <!-- Header -->
  <text x="116" y="98" font-size="13" font-weight="800" fill="#FFFFFF">Analytics</text>
  <text x="116" y="110" font-size="6.5" fill="rgba(255,255,255,0.4)">14 transactions this period</text>

  <!-- Net balance pill -->
  <rect x="110" y="116" width="170" height="46" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="118" y="130" font-size="6.5" fill="rgba(255,255,255,0.45)">Net Balance</text>
  <text x="118" y="147" font-size="16" font-weight="800" fill="#FFFFFF">+$10,699</text>
  <rect x="218" y="120" width="46" height="14" rx="7" fill="rgba(76,175,130,0.25)"/>
  <text x="241" y="130" font-size="6" fill="#4CAF82" text-anchor="middle" font-weight="700">↗ Surplus</text>
  <rect x="118" y="151" width="50" height="7" rx="3.5" fill="rgba(76,175,130,0.15)"/>
  <text x="121" y="157" font-size="5.5" fill="#4CAF82">Income $20,254</text>
  <rect x="173" y="151" width="48" height="7" rx="3.5" fill="rgba(224,82,82,0.12)"/>
  <text x="176" y="157" font-size="5.5" fill="#E05252">Expense $9,555</text>

  <!-- Period selector -->
  <rect x="110" y="168" width="170" height="14" rx="7" fill="rgba(255,255,255,0.04)"/>
  <rect x="112" y="170" width="30" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <text x="127" y="178" font-size="5.5" fill="rgba(255,255,255,0.4)" text-anchor="middle">Week</text>
  <rect x="146" y="170" width="32" height="10" rx="5" fill="#2D4A52"/>
  <text x="162" y="178" font-size="5.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Month</text>
  <text x="200" y="178" font-size="5.5" fill="rgba(255,255,255,0.35)" text-anchor="middle">3 Mo</text>
  <text x="234" y="178" font-size="5.5" fill="rgba(255,255,255,0.35)" text-anchor="middle">Year</text>

  <!-- Chart area -->
  <rect x="110" y="187" width="170" height="88" rx="12" fill="rgba(255,255,255,0.05)"/>
  <text x="118" y="200" font-size="7" font-weight="700" fill="#FFFFFF">Financial Overview</text>
  <!-- Chart lines -->
  <path d="M 116,250 L 130,238 L 146,243 L 162,228 L 178,234 L 194,222 L 210,218 L 226,222 L 268,214" fill="none" stroke="rgba(76,175,130,0.2)" stroke-width="1"/>
  <path d="M 116,255 L 130,244 L 146,250 L 162,238 L 178,242 L 194,230 L 210,234 L 226,228 L 268,220 L 268,268 L 116,268 Z" fill="url(#gf)" clip-path="url(#pc)"/>
  <path d="M 116,260 L 130,250 L 146,256 L 162,244 L 178,248 L 194,238 L 210,240 L 226,236 L 268,230 L 268,268 L 116,268 Z" fill="url(#rf)" clip-path="url(#pc)"/>
  <path d="M 116,255 L 130,244 L 146,250 L 162,228 L 178,234 L 194,222 L 210,218 L 226,222 L 268,214" fill="none" stroke="#4CAF82" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#pc)"/>
  <path d="M 116,260 L 130,250 L 146,256 L 162,244 L 178,248 L 194,238 L 210,240 L 226,236 L 268,230" fill="none" stroke="#E05252" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#pc)"/>
  <circle cx="268" cy="214" r="3.5" fill="#4CAF82"/><circle cx="268" cy="214" r="1.5" fill="#FFFFFF"/>
  <!-- tooltip -->
  <rect x="246" y="203" width="36" height="10" rx="5" fill="#4CAF82"/>
  <text x="264" y="211" font-size="5.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">$20,254</text>
  <!-- legend -->
  <circle cx="118" cy="207" r="2.5" fill="#4CAF82"/><text x="123" y="210" font-size="5.5" fill="rgba(255,255,255,0.45)">Income</text>
  <circle cx="148" cy="207" r="2.5" fill="#E05252"/><text x="153" y="210" font-size="5.5" fill="rgba(255,255,255,0.45)">Expense</text>

  <!-- === THEME SELECTOR at bottom of phone === -->
  <rect x="110" y="281" width="170" height="36" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
  <text x="118" y="293" font-size="6.5" fill="rgba(255,255,255,0.5)">🎨  Choose Theme</text>
  <!-- 6 theme circles -->
  <circle cx="122" cy="308" r="7" fill="url(#th1)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  <circle cx="138" cy="308" r="7" fill="#22C55E" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <circle cx="154" cy="308" r="7" fill="#8B5CF6" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <circle cx="170" cy="308" r="7" fill="#F59E0B" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <circle cx="186" cy="308" r="7" fill="#EC4899" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <circle cx="202" cy="308" r="7" fill="#EF4444" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <!-- active check on first -->
  <text x="122" y="312" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="800">✓</text>
  <!-- dark/light toggle -->
  <rect x="214" y="301" width="58" height="14" rx="7" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <circle cx="224" cy="308" r="5" fill="#2D4A52" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
  <text x="248" y="312" font-size="6" fill="rgba(255,255,255,0.55)" text-anchor="middle">● Dark</text>

  <!-- Bottom nav on phone -->
  <rect x="100" y="348" width="190" height="1" fill="rgba(255,255,255,0.07)"/>
  <text x="122" y="364" font-size="6.5" text-anchor="middle" fill="rgba(255,255,255,0.4)">🏠</text>
  <text x="153" y="364" font-size="6.5" text-anchor="middle" fill="rgba(255,255,255,0.4)">💼</text>
  <text x="195" y="364" font-size="6.5" text-anchor="middle" fill="rgba(255,255,255,0.4)">↺</text>
  <text x="237" y="364" font-size="6.5" text-anchor="middle" fill="rgba(255,255,255,0.9)">📊</text>
  <text x="268" y="364" font-size="6.5" text-anchor="middle" fill="rgba(255,255,255,0.4)">👤</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- FLOATING ELEMENTS outside phone           -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Savings rate badge (left) -->
  <g transform="translate(8, 155)" filter="url(#sh)">
    <rect width="84" height="72" rx="18" fill="#4CAF82"/>
    <text x="42" y="20" font-size="8" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-weight="600">SAVINGS RATE</text>
    <text x="42" y="44" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">38%</text>
    <text x="42" y="60" font-size="7.5" fill="rgba(255,255,255,0.8)" text-anchor="middle">↑ +5% vs last month</text>
  </g>

  <!-- Theme preview cards (right, stacked) -->
  <g transform="translate(298, 120)">
    <!-- Card 1: Teal (active, your app) -->
    <rect width="82" height="52" rx="14" fill="url(#th1)" filter="url(#sh)"/>
    <rect x="0" y="0" width="82" height="52" rx="14" fill="none" stroke="#4CAF82" stroke-width="1.5"/>
    <rect x="6" y="6" width="70" height="14" rx="5" fill="rgba(76,175,130,0.5)"/>
    <text x="41" y="16" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="700">Teal Dark ✓</text>
    <rect x="6" y="24" width="40" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="6" y="34" width="28" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="52" y="24" width="24" height="16" rx="5" fill="rgba(76,175,130,0.3)"/>
  </g>

  <g transform="translate(298, 182)">
    <!-- Card 2: Purple theme -->
    <rect width="82" height="52" rx="14" fill="url(#th3)" filter="url(#sh)"/>
    <rect x="6" y="6" width="70" height="14" rx="5" fill="rgba(155,111,212,0.6)"/>
    <text x="41" y="16" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="700">Purple Dark</text>
    <rect x="6" y="24" width="40" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
    <rect x="6" y="34" width="28" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="52" y="24" width="24" height="16" rx="5" fill="rgba(155,111,212,0.35)"/>
  </g>

  <g transform="translate(298, 244)">
    <!-- Card 3: Light theme -->
    <rect width="82" height="52" rx="14" fill="url(#th6)" filter="url(#sh)"/>
    <rect x="6" y="6" width="70" height="14" rx="5" fill="rgba(99,102,241,0.7)"/>
    <text x="41" y="16" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="700">Light Mode</text>
    <rect x="6" y="24" width="40" height="6" rx="3" fill="rgba(0,0,0,0.08)"/>
    <rect x="6" y="34" width="28" height="6" rx="3" fill="rgba(0,0,0,0.05)"/>
    <rect x="52" y="24" width="24" height="16" rx="5" fill="rgba(99,102,241,0.2)"/>
  </g>

  <!-- "6 Themes" label connecting right cards -->
  <rect x="298" y="304" width="82" height="26" rx="13" fill="rgba(155,111,212,0.15)" stroke="rgba(155,111,212,0.35)" stroke-width="1"/>
  <text x="339" y="321" font-size="8.5" fill="#9B6FD4" text-anchor="middle" font-weight="700">+ 3 more themes</text>

  <!-- Profile avatar badge (left lower) -->
  <g transform="translate(8, 295)" filter="url(#sh)">
    <rect width="84" height="84" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Avatar circle -->
    <circle cx="42" cy="28" r="18" fill="rgba(76,175,130,0.2)" stroke="#4CAF82" stroke-width="1.5"/>
    <text x="42" y="33" font-size="18" text-anchor="middle">👤</text>
    <!-- Stats row -->
    <rect x="8" y="52" width="68" height="24" rx="8" fill="rgba(255,255,255,0.06)"/>
    <text x="24" y="62" font-size="5.5" fill="rgba(255,255,255,0.45)" text-anchor="middle">txns</text>
    <text x="24" y="71" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">128</text>
    <line x1="42" y1="54" x2="42" y2="74" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <text x="60" y="62" font-size="5.5" fill="rgba(255,255,255,0.45)" text-anchor="middle">budgets</text>
    <text x="60" y="71" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
  </g>

  </svg>
